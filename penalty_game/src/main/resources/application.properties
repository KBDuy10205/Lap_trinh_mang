spring.application.name=penalty-game
server.port=${SERVER_PORT:8080}
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}

# Không ghi thông tin MySQL thật vào source. Đặt các biến DB_* trước khi chạy.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/penalty_game?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Cho phép khởi động trang kiểm tra ngay cả khi MySQL cục bộ chưa sẵn sàng.
spring.datasource.hikari.initialization-fail-timeout=-1
spring.datasource.hikari.connection-timeout=3000
spring.sql.init.mode=never
