<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập - Game đá luân lưu</title>
    <link rel="stylesheet" href="/css/app.css?v=20261117-visual1">
</head>
<body>
    <main class="page">
        <h1>Game đá luân lưu 2 người</h1>
        <p id="message" class="message">Đang kiểm tra phiên đăng nhập...</p>

        <section id="guest-area" class="card">
            <form id="login-form">
                <h2>Đăng nhập</h2>
                <label>
                    Tên đăng nhập
                    <input name="username" required minlength="3" maxlength="50" autocomplete="username">
                </label>
                <label>
                    Mật khẩu
                    <input name="password" type="password" required minlength="8" maxlength="72" autocomplete="current-password">
                </label>
                <button id="login-button" type="submit">Đăng nhập</button>
            </form>
            <p class="form-link">Chưa có tài khoản? <a href="/register.html">Đăng ký</a></p>
        </section>

    </main>

    <script src="/js/app.js?v=20261117-3"></script>
</body>
</html>
